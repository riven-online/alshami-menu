<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>الشامي السوري - المنيو</title>
<style>
  :root {
    --primary: #e63946;
    --primary-dark: #b81f2d;
    --gold: #f4a261;
    --dark: #0f0f0f;
    --dark-2: #1a1a1a;
    --dark-3: #252525;
    --text: #f5f5f5;
    --text-dim: #a0a0a0;
    --green: #06d6a0;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { background: var(--dark); color: var(--text); padding-bottom: 100px; overflow-x: hidden; }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    background: linear-gradient(135deg, #1a0a0a 0%, #2d0f14 50%, #1a0a0a 100%);
    padding: 30px 20px 25px;
    overflow: hidden;
    border-bottom: 1px solid rgba(244,162,97,0.15);
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%; right: -20%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(230,57,70,0.25) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 0.9; } }

  .hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  .logo-circle {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff, #f0f0f0);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(230,57,70,0.4), 0 0 0 4px rgba(244,162,97,0.3);
    font-size: 45px;
    margin-bottom: 5px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .hero h1 {
    font-size: 26px;
    background: linear-gradient(90deg, #fff, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
    letter-spacing: 0.5px;
  }
  .hero .subtitle { color: var(--text-dim); font-size: 13px; font-weight: 500; }
  .hero-info {
    display: flex; gap: 10px; margin-top: 10px;
    flex-wrap: wrap; justify-content: center;
  }
  .hero-info span {
    background: rgba(255,255,255,0.06);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    border: 1px solid rgba(244,162,97,0.2);
    color: var(--text);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .hero-info .open-badge { color: var(--green); border-color: rgba(6,214,160,0.3); background: rgba(6,214,160,0.08); }
  .dot-live { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: blink 1.5s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }

  /* ===== SEARCH ===== */
  .search-wrap {
    padding: 15px 15px 5px;
    position: sticky; top: 0; z-index: 50;
    background: var(--dark);
  }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--dark-2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 15px;
    transition: border-color 0.3s;
  }
  .search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230,57,70,0.15); }
  .search-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; font-family: inherit;
  }
  .search-box input::placeholder { color: var(--text-dim); }
  .search-icon { color: var(--text-dim); font-size: 18px; }

  /* ===== CATEGORIES ===== */
  .categories {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding: 10px 15px 15px;
    scrollbar-width: none;
    position: sticky; top: 65px; z-index: 49;
    background: var(--dark);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-pill {
    white-space: nowrap;
    padding: 9px 18px;
    border-radius: 25px;
    background: var(--dark-2);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-dim);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    font-family: inherit;
  }
  .cat-pill.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(230,57,70,0.4);
    transform: scale(1.05);
  }

  /* ===== MENU ===== */
  .menu-container { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .section-title {
    grid-column: 1 / -1;
    font-size: 20px; font-weight: 800;
    padding: 5px 0 10px;
    display: flex; align-items: center; gap: 10px;
    color: var(--text);
  }
  .section-title::before {
    content: ''; width: 4px; height: 22px;
    background: linear-gradient(180deg, var(--primary), var(--gold));
    border-radius: 4px;
  }

  .item-card {
    background: linear-gradient(145deg, var(--dark-2), var(--dark-3));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 14px;
    display: flex; gap: 14px;
    transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    position: relative;
    overflow: hidden;
    animation: slideUp 0.4s ease backwards;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .item-card:active { transform: scale(0.98); border-color: rgba(244,162,97,0.3); }

  .item-img {
    width: 80px; height: 80px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3a1a1f, #2a1414);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    flex-shrink: 0;
    border: 1px solid rgba(244,162,97,0.15);
    position: relative;
    overflow: hidden;
  }
  .item-img::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent 60%);
  }

  .item-body { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .item-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; }
  .item-sub { font-size: 12px; color: var(--text-dim); }
  
  .options-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .opt-chip {
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .opt-chip.selected {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(230,57,70,0.35);
  }

  .price-action { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; }
  .price { color: var(--gold); font-weight: 800; font-size: 17px; }
  .price small { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-right: 2px; }

  .add-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    width: 38px; height: 38px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(230,57,70,0.4);
    transition: all 0.2s;
    font-family: inherit;
    flex-shrink: 0;
  }
  .add-btn:active { transform: scale(0.9); }

  /* Quantity stepper inside card */
  .qty-stepper { display: flex; align-items: center; gap: 8px; background: var(--dark); border-radius: 12px; padding: 4px; border: 1px solid rgba(244,162,97,0.3); }
  .qty-stepper button {
    width: 30px; height: 30px;
    border-radius: 9px;
    border: none;
    background: var(--primary);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .qty-stepper button.minus { background: rgba(255,255,255,0.1); }
  .qty-stepper .count { min-width: 20px; text-align: center; font-weight: 700; color: var(--gold); font-size: 15px; }

  /* ===== FLOATING CART ===== */
  .cart-float {
    position: fixed;
    bottom: 20px;
    right: 15px; left: 15px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border-radius: 18px;
    padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 10px 30px rgba(230,57,70,0.5), 0 0 0 1px rgba(255,255,255,0.1);
    cursor: pointer;
    transform: translateY(120px);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    z-index: 100;
    color: white;
  }
  .cart-float.show { transform: translateY(0); }
  .cart-float:active { transform: translateY(0) scale(0.98); }
  .cart-left { display: flex; align-items: center; gap: 12px; }
  .cart-badge {
    background: white; color: var(--primary);
    width: 30px; height: 30px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
  }
  .cart-total { font-size: 17px; font-weight: 800; }
  .cart-label { font-size: 12px; opacity: 0.9; }
  .cart-right { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }

  /* ===== CART MODAL ===== */
  .cart-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .cart-overlay.show { opacity: 1; pointer-events: auto; }

  .cart-drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--dark-2);
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    z-index: 201;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .cart-drawer.show { transform: translateY(0); }
  .cart-handle {
    width: 45px; height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    margin: 12px auto 5px;
  }
  .cart-head {
    padding: 10px 20px 15px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .cart-head h3 { font-size: 18px; font-weight: 800; }
  .cart-head .close-x {
    background: rgba(255,255,255,0.08); border: none;
    width: 32px; height: 32px; border-radius: 50%;
    color: var(--text); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  
  .cart-list { padding: 10px 20px; overflow-y: auto; flex: 1; }
  .cart-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .cart-empty .emoji { font-size: 50px; margin-bottom: 10px; opacity: 0.6; }
  
  .cart-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .cart-row:last-child { border-bottom: none; }
  .cart-row-img {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #3a1a1f, #2a1414);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .cart-row-body { flex: 1; min-width: 0; }
  .cart-row-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .cart-row-meta { font-size: 12px; color: var(--gold); font-weight: 700; }
  .cart-row-qty { display: flex; align-items: center; gap: 6px; }
  .cart-row-qty button {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: var(--dark-3);
    color: var(--text);
    font-size: 16px; font-weight: bold;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit;
  }
  .cart-row-qty button.plus { background: var(--primary); border-color: var(--primary); }
  .cart-row-qty .q { min-width: 20px; text-align: center; font-weight: 700; font-size: 14px; }

  .cart-foot {
    padding: 15px 20px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: var(--dark-2);
    border-bottom-left-radius: 0;
  }
  .cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: var(--text-dim); }
  .cart-summary-row.total { color: var(--text); font-size: 18px; font-weight: 800; margin: 10px 0 15px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); }
  .cart-summary-row.total .t-price { color: var(--gold); }
  
  .checkout-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--green), #04a87a);
    color: white;
    border: none;
    padding: 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 20px rgba(6,214,160,0.35);
    transition: all 0.2s;
    font-family: inherit;
  }
  .checkout-btn:active { transform: scale(0.97); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--green);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    z-index: 300;
    box-shadow: 0 8px 24px rgba(6,214,160,0.4);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ===== NO RESULTS ===== */
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .no-results .emoji { font-size: 50px; margin-bottom: 10px; }

  /* ===== ITEM COUNT BADGE ===== */
  .item-qty-badge {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--green);
    color: white;
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 800;
    box-shadow: 0 3px 10px rgba(6,214,160,0.5);
    z-index: 2;
  }

  /* Loading */
  .loading {
    grid-column: 1/-1;
    text-align: center;
    padding: 50px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <div class="logo-circle">🥙</div>
    <h1>الشامي السوري</h1>
    <p class="subtitle">مطعم أهل العاشر - أشهى المأكولات السورية</p>
    <div class="hero-info">
      <span class="open-badge"><span class="dot-live"></span> مفتوح الآن</span>
      <span>📞 01285666692</span>
      <span>🚗 توصيل متاح</span>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="ابحث عن صنف... (شاورما، برجر، فراخ)" oninput="handleSearch(this.value)">
  </div>
</div>

<!-- CATEGORIES -->
<div class="categories" id="categories"></div>

<!-- MENU -->
<div class="menu-container" id="menu"></div>

<!-- FLOATING CART -->
<div class="cart-float" id="cartFloat" onclick="openCart()">
  <div class="cart-left">
    <div class="cart-badge" id="cartBadge">0</div>
    <div>
      <div class="cart-label">إجمالي الطلب</div>
      <div class="cart-total"><span id="cartTotalFloat">0</span> ج.م</div>
    </div>
  </div>
  <div class="cart-right">عرض السلة ←</div>
</div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-handle"></div>
  <div class="cart-head">
    <h3>🛒 سلة الطلبات</h3>
    <button class="close-x" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-foot" id="cartFoot" style="display:none;">
    <div class="cart-summary-row"><span>عدد الأصناف</span><span id="summaryCount">0</span></div>
    <div class="cart-summary-row total"><span>الإجمالي</span><span class="t-price"><span id="summaryTotal">0</span> ج.م</span></div>
    <button class="checkout-btn" onclick="sendToWhatsApp()">
      <span>📲</span> إتمام الطلب على واتساب
    </button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span>✓</span> <span id="toastMsg">تمت الإضافة</span></div>

    { category: "تشاورما اللحم", icon: "🥙", items: [

    { category: "السندوتشات", icon: "🥪", items: [
      { name: "سندوتش برجر لحم", img: "🍔", options: [{label: "سوري", price: 60}, {label: "فرنساوي", price: 70}] },
      { name: "سندوتش برجر فراخ", img: "🍔", options: [{label: "سوري", price: 70}, {label: "فرنساوي", price: 80}] },
      { name: "سندوتش شيش طاووق", img: "🌯", options: [{label: "عادي", price: 75}] },
      { name: "سندوتش كفتة فراخ", img: "🌯", options: [{label: "عادي", price: 45}] },
      { name: "سندوتش كباب عجل", img: "🌯", options: [{label: "عادي", price: 80}] }
    ]},
    { category: "البروستد", icon: "🍗", items: [
      { name: "وجبة فرخة كاملة بروستد", img: "🍗", options: [{label: "عادي", price: 435}] },
      { name: "نصف فرخة بروستد", img: "🍗", options: [{label: "عادي", price: 225}] },
      { name: "ربع فرخة بروستد", img: "🍗", options: [{label: "عادي", price: 125}] }
    ]},
    { category: "الفراخ الغربي", icon: "🍟", items: [
      { name: "وجبة فراخ كرسبي", img: "🍗", options: [{label: "عادي", price: 145}] },
      { name: "وجبة زنجر فراخ", img: "🌶️", options: [{label: "عادي", price: 160}] },
      { name: "وجبة شيش طاووق", img: "🍢", options: [{label: "عادي", price: 140}] },
      { name: "وجبة فاهيتا فراخ", img: "🌮", options: [{label: "عادي", price: 125}] }
    ]},
    { category: "وجبات الفراخ", icon: "🍗", items: [
      { name: "وجبة فرخة كاملة", img: "🐔", options: [{label: "شوایة", price: 420}, {label: "فحم", price: 400}] },
      { name: "وجبة نصف فرخة", img: "🍗", options: [{label: "شوایة", price: 220}, {label: "فحم", price: 210}] },
      { name: "وجبة ربع فرخة", img: "🍗", options: [{label: "شوایة", price: 110}, {label: "فحم", price: 105}] },
      { name: "وجبة أجنحة فراخ", img: "🍗", options: [{label: "عادي", price: 95}] }
    ]},
    { category: "سندوتشات البرجر", icon: "🍔", items: [
      { name: "سندوتش برجر سادة", img: "🍔", options: [{label: "لحم", price: 60}, {label: "فراخ", price: 70}] },
      { name: "سندوتش برجر موتزاريلا", img: "🧀", options: [{label: "لحم", price: 70}, {label: "فراخ", price: 80}] },
      { name: "سندوتش برجر بالبيض", img: "🍳", options: [{label: "لحم", price: 80}, {label: "فراخ", price: 90}] },
      { name: "سندوتش برجر دوبل", img: "🍔", options: [{label: "لحم", price: 90}, {label: "فراخ", price: 100}] }
    ]}
  ];

  // ====== STATE ======
  let cart = []; // { id, name, img, size, price, qty }
  let currentCategory = menuData[0].category;
  let selectedOptions = {}; // { itemKey: optionIndex }
  let searchQuery = "";

  // ====== RENDER CATEGORIES ======
  const categoriesEl = document.getElementById('categories');
  function renderCategories() {
    categoriesEl.innerHTML = '';
    menuData.forEach(cat => {
      const b = document.createElement('button');
      b.className = 'cat-pill' + (cat.category === currentCategory && !searchQuery ? ' active' : '');
      b.innerHTML = `${cat.icon} ${cat.category}`;
      b.onclick = () => {
        currentCategory = cat.category;
        searchQuery = "";
        document.getElementById('searchInput').value = "";
        renderCategories();
        renderMenu();
        window.scrollTo({ top: 250, behavior: 'smooth' });
      };
      categoriesEl.appendChild(b);
    });
  }

  // ====== RENDER MENU ======
  function renderMenu() {
    const menuEl = document.getElementById('menu');
    menuEl.innerHTML = '';

    if (searchQuery.trim()) {
      // Search mode - show all matching items
      const q = searchQuery.trim();
      let results = [];
      menuData.forEach(cat => {
        cat.items.forEach((item, idx) => {
          if (item.name.includes(q)) {
            results.push({ ...item, category: cat.category, itemIndex: idx, catIcon: cat.icon });
          }
        });
      });

      if (results.length === 0) {
        menuEl.innerHTML = `<div class="no-results"><div class="emoji">🔍</div><div>مفيش نتائج للبحث عن "${q}"</div></div>`;
        return;
      }
      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerText = `نتائج البحث (${results.length})`;
      menuEl.appendChild(title);
      results.forEach(r => menuEl.appendChild(createCard(r, r.itemIndex, r.category)));
    } else {
      // Normal mode
      const cat = menuData.find(c => c.category === currentCategory);
      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerText = `${cat.icon} ${cat.category}`;
      menuEl.appendChild(title);
      cat.items.forEach((item, idx) => menuEl.appendChild(createCard(item, idx, cat.category)));
    }
  }

  // ====== CREATE CARD ======
  function createCard(item, itemIndex, categoryName) {
    const key = `${categoryName}__${item.name}`;
    const card = document.createElement('div');
    card.className = 'item-card';
    card.style.animationDelay = `${itemIndex * 0.04}s`;

    // Build options chips
    const selectedIdx = selectedOptions[key];
    let optsHTML = '';
    item.options.forEach((opt, i) => {
      const sel = selectedIdx === i ? 'selected' : '';
      optsHTML += `<button class="opt-chip ${sel}" onclick="selectOpt(event,'${key}',${i})">${opt.label} · ${opt.price} ج.م</button>`;
    });

    // Check if this item is in cart
    const cartItem = cart.find(c => c.id === key && c.size === item.options[selectedIdx !== undefined ? selectedIdx : 0].label);
    const qty = cartItem ? cartItem.qty : 0;
    const currentOptIdx = selectedIdx !== undefined ? selectedIdx : 0;
    const currentPrice = item.options[currentOptIdx].price;
    
    let actionHTML = '';
    if (qty > 0) {
      actionHTML = `
        <div class="qty-stepper">
          <button class="minus" onclick="changeQty(event,'${key}','${item.options[currentOptIdx].label}',-1)">−</button>
          <span class="count">${qty}</span>
          <button onclick="changeQty(event,'${key}','${item.options[currentOptIdx].label}',1)">+</button>
        </div>`;
    } else {
      actionHTML = `<button class="add-btn" onclick="addToCart(event,'${key}','${item.name}','${item.img}',${currentOptIdx})">+</button>`;
    }

    const totalQty = cart.filter(c => c.id === key).reduce((s, c) => s + c.qty, 0);
    const badgeHTML = totalQty > 0 ? `<div class="item-qty-badge">${totalQty}</div>` : '';

    card.innerHTML = `
      ${badgeHTML}
      <div class="item-img">${item.img}</div>
      <div class="item-body">
        <div class="item-title">${item.name}</div>
        <div class="options-row">${optsHTML}</div>
        <div class="price-action">
          <div class="price">${currentPrice} <small>ج.م</small></div>
          ${actionHTML}
        </div>
      </div>
    `;
    return card;
  }

  // ====== INTERACTIONS ======
  function selectOpt(e, key, idx) {
    e.stopPropagation();
    selectedOptions[key] = idx;
    renderMenu();
  }

  function addToCart(e, key, name, img, optIdx) {
    e.stopPropagation();
    // Find the item to get its price
    let foundItem = null, foundCat = null;
    menuData.forEach(cat => {
      cat.items.forEach(it => {
        if (`${cat.category}__${it.name}` === key) { foundItem = it; foundCat = cat; }
      });
    });
    if (!foundItem) return;
    const opt = foundItem.options[optIdx];
    const existing = cart.find(c => c.id === key && c.size === opt.label);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id: key, name, img, size: opt.label, price: opt.price, qty: 1 });
    }
    selectedOptions[key] = undefined;
    showToast(`تمت إضافة ${name}`);
    updateCart();
    renderMenu();
  }

  function changeQty(e, key, size, delta) {
    e.stopPropagation();
    const idx = cart.findIndex(c => c.id === key && c.size === size);
    if (idx === -1) return;
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    updateCart();
    renderMenu();
    if (document.getElementById('cartDrawer').classList.contains('show')) renderCartList();
  }

  function removeItem(idx) {
    cart.splice(idx, 1);
    updateCart();
    renderMenu();
    renderCartList();
  }

  // ====== SEARCH ======
  function handleSearch(val) {
    searchQuery = val;
    if (val.trim()) {
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    } else {
      renderCategories();
    }
    renderMenu();
  }

  // ====== CART ======
  function updateCart() {
    const totalQty = cart.reduce((s, c) => s + c.qty, 0);
    const totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
    const floatEl = document.getElementById('cartFloat');
    if (totalQty === 0) {
      floatEl.classList.remove('show');
    } else {
      floatEl.classList.add('show');
    }
    document.getElementById('cartBadge').innerText = totalQty;
    document.getElementById('cartTotalFloat').innerText = totalPrice;
  }

  function openCart() {
    renderCartList();
    document.getElementById('cartOverlay').classList.add('show');
    document.getElementById('cartDrawer').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeCart() {
    document.getElementById('cartOverlay').classList.remove('show');
    document.getElementById('cartDrawer').classList.remove('show');
    document.body.style.overflow = '';
  }

  function renderCartList() {
    const listEl = document.getElementById('cartList');
    const footEl = document.getElementById('cartFoot');
    if (cart.length === 0) {
      listEl.innerHTML = `<div class="cart-empty"><div class="emoji">🛒</div><div>سلتك فاضية</div><div style="font-size:12px;margin-top:5px;">أضف أصناف تبدأ طلبك</div></div>`;
      footEl.style.display = 'none';
      return;
    }
    footEl.style.display = 'block';
    let html = '';
    cart.forEach((item, idx) => {
      html += `
        <div class="cart-row">
          <div class="cart-row-img">${item.img}</div>
          <div class="cart-row-body">
            <div class="cart-row-name">${item.name}</div>
            <div class="cart-row-meta">${item.size} · ${item.price} ج.م</div>
          </div>
          <div class="cart-row-qty">
            <button onclick="removeOrDec(${idx})">−</button>
            <span class="q">${item.qty}</span>
            <button class="plus" onclick="incItem(${idx})">+</button>
          </div>
        </div>
      `;
    });
    listEl.innerHTML = html;
    const totalQty = cart.reduce((s, c) => s + c.qty, 0);
    const totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
    document.getElementById('summaryCount').innerText = totalQty;
    document.getElementById('summaryTotal').innerText = totalPrice;
  }

  function incItem(idx) {
    cart[idx].qty += 1;
    updateCart(); renderMenu(); renderCartList();
  }
  function removeOrDec(idx) {
    cart[idx].qty -= 1;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    updateCart(); renderMenu(); renderCartList();
  }

  // ====== WHATSAPP ======
  function sendToWhatsApp() {
    if (cart.length === 0) return;
    const phone = "201285666692";
    let msg = "🌯 *طلب جديد من مطعم الشامي السوري*\n";
    msg += "━━━━━━━━━━━━━━━\n";
    let total = 0;
    cart.forEach(item => {
      const line = item.price * item.qty;
      total += line;
      msg += `▪️ ${item.name} (${item.size}) × ${item.qty} = ${line} ج.م\n`;
    });
    msg += "━━━━━━━━━━━━━━━\n";
    msg += `💰 *الإجمالي: ${total} ج.م*\n\n`;
    msg += "📍 العنوان: \n";
    msg += "📞 رقم الموبايل: ";
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
  }

  // ====== TOAST ======
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ====== INIT ======
  renderCategories();
  renderMenu();
  updateCart();
</script>
</body>
