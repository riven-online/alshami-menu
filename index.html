<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اسم المطعم</title>
<style>
/* ============================================
   🎨 الألوان - تتغير من CONFIG
   ============================================ */
:root {
  --primary: #e63946;
  --primary-dark: #b81f2d;
  --gold: #f4a261;
  --green: #06d6a0;

  /* Dark mode colors */
  --bg: #0f0f0f;
  --bg-2: #1a1a1a;
  --bg-3: #252525;
  --text: #f5f5f5;
  --text-dim: #a0a0a0;
  --border: rgba(255,255,255,0.08);
  --card-shadow: 0 8px 24px rgba(0,0,0,0.4);
  --hero-bg: linear-gradient(135deg, #1a0a0a 0%, #2d0f14 50%, #1a0a0a 100%);
  --hero-glow-1: rgba(230,57,70,0.25);
  --hero-glow-2: rgba(244,162,97,0.15);
  --overlay-bg: rgba(0,0,0,0.7);
}

[data-theme="light"] {
  --bg: #f5f5f7;
  --bg-2: #ffffff;
  --bg-3: #f0f0f5;
  --text: #1a1a1a;
  --text-dim: #666;
  --border: rgba(0,0,0,0.08);
  --card-shadow: 0 4px 16px rgba(0,0,0,0.08);
  --hero-bg: linear-gradient(135deg, #fff5f0 0%, #ffe8e0 50%, #fff5f0 100%);
  --hero-glow-1: rgba(230,57,70,0.15);
  --hero-glow-2: rgba(244,162,97,0.2);
  --overlay-bg: rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); padding-bottom: 100px; overflow-x: hidden; transition: background 0.4s, color 0.4s; }

/* ===== HERO ===== */
.hero { position: relative; background: var(--hero-bg); padding: 30px 20px 25px; overflow: hidden; border-bottom: 1px solid var(--border); transition: background 0.4s; }
.hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px; background: radial-gradient(circle, var(--hero-glow-1) 0%, transparent 70%); border-radius: 50%; animation: pulse 4s ease-in-out infinite; }
.hero::after { content: ''; position: absolute; bottom: -50%; left: -20%; width: 300px; height: 300px; background: radial-gradient(circle, var(--hero-glow-2) 0%, transparent 70%); border-radius: 50%; animation: pulse 5s ease-in-out infinite reverse; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }

.theme-toggle {
  position: absolute;
  top: 15px; left: 15px;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  transition: all 0.3s;
  box-shadow: var(--card-shadow);
}
.theme-toggle:active { transform: scale(0.9); }

.hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.logo-circle { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(145deg, #fff, #f0f0f0); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(230,57,70,0.35), 0 0 0 4px rgba(244,162,97,0.25); font-size: 45px; margin-bottom: 5px; animation: float 3s ease-in-out infinite; overflow: hidden; }
.logo-circle img { width: 100%; height: 100%; object-fit: cover; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

.hero h1 { font-size: 26px; background: linear-gradient(90deg, var(--text), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 800; letter-spacing: 0.5px; }
.hero .subtitle { color: var(--text-dim); font-size: 13px; font-weight: 500; }
.hero-info { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
.hero-info span { background: var(--bg-2); padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); color: var(--text); display: inline-flex; align-items: center; gap: 5px; }
.hero-info .open-badge { color: var(--green); border-color: rgba(6,214,160,0.3); background: rgba(6,214,160,0.08); }
[data-theme="light"] .hero-info .open-badge { background: rgba(6,214,160,0.1); }
.dot-live { width: 7px; height: 7px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); animation: blink 1.5s infinite; }
@keyframes blink { 50% { opacity: 0.4; } }

/* ===== SEARCH ===== */
.search-wrap { padding: 15px 15px 5px; position: sticky; top: 0; z-index: 50; background: var(--bg); }
.search-box { display: flex; align-items: center; gap: 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 15px; transition: border-color 0.3s, background 0.4s; }
.search-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(230,57,70,0.15); }
.search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 15px; font-family: inherit; }
.search-box input::placeholder { color: var(--text-dim); }
.search-icon { color: var(--text-dim); font-size: 18px; }

/* ===== CATEGORIES ===== */
.categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px 15px; scrollbar-width: none; position: sticky; top: 65px; z-index: 49; background: var(--bg); border-bottom: 1px solid var(--border); transition: background 0.4s; }
.categories::-webkit-scrollbar { display: none; }
.cat-pill { white-space: nowrap; padding: 9px 18px; border-radius: 25px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim); font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); font-family: inherit; }
.cat-pill.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border-color: transparent; box-shadow: 0 4px 14px rgba(230,57,70,0.4); transform: scale(1.05); }

/* ===== MENU ===== */
.menu-container { padding: 15px; display: grid; grid-template-columns: 1fr; gap: 12px; }
.section-title { grid-column: 1 / -1; font-size: 20px; font-weight: 800; padding: 5px 0 10px; display: flex; align-items: center; gap: 10px; color: var(--text); }
.section-title::before { content: ''; width: 4px; height: 22px; background: linear-gradient(180deg, var(--primary), var(--gold)); border-radius: 4px; }

.item-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; gap: 14px; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden; animation: slideUp 0.4s ease backwards; box-shadow: var(--card-shadow); }
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.item-card:active { transform: scale(0.98); border-color: rgba(244,162,97,0.3); }

.item-img { width: 80px; height: 80px; border-radius: 14px; background: linear-gradient(135deg, #3a1a1f, #2a1414); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; border: 1px solid rgba(244,162,97,0.15); position: relative; overflow: hidden; }
.item-img img { width: 100%; height: 100%; object-fit: cover; }

.item-body { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-top-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.item-title { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; }
.badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: 700; }
.badge.hot { background: rgba(230,57,70,0.15); color: var(--primary); }
.badge.new { background: rgba(6,214,160,0.15); color: var(--green); }
.badge.best { background: rgba(244,162,97,0.15); color: var(--gold); }

.item-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; }

.options-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.opt-chip { padding: 5px 12px; border-radius: 20px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.opt-chip.selected { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border-color: transparent; box-shadow: 0 3px 10px rgba(230,57,70,0.35); }

.price-action { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; gap: 10px; }
.price { color: var(--gold); font-weight: 800; font-size: 17px; }
.price small { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-right: 2px; }
.add-btn { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; width: 38px; height: 38px; border-radius: 12px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(230,57,70,0.4); transition: all 0.2s; font-family: inherit; flex-shrink: 0; }
.add-btn:active { transform: scale(0.9); }

.qty-stepper { display: flex; align-items: center; gap: 8px; background: var(--bg-3); border-radius: 12px; padding: 4px; border: 1px solid rgba(244,162,97,0.3); }
.qty-stepper button { width: 30px; height: 30px; border-radius: 9px; border: none; background: var(--primary); color: white; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.qty-stepper button.minus { background: var(--bg-2); color: var(--text); border: 1px solid var(--border); }
.qty-stepper .count { min-width: 20px; text-align: center; font-weight: 700; color: var(--gold); font-size: 15px; }

/* ===== FLOATING CART ===== */
.cart-float { position: fixed; bottom: 20px; right: 15px; left: 15px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(230,57,70,0.5), 0 0 0 1px rgba(255,255,255,0.1); cursor: pointer; transform: translateY(120px); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 100; color: white; }
.cart-float.show { transform: translateY(0); }
.cart-left { display: flex; align-items: center; gap: 12px; }
.cart-badge { background: white; color: var(--primary); width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.cart-total { font-size: 17px; font-weight: 800; }
.cart-label { font-size: 12px; opacity: 0.9; }
.cart-right { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }

/* ===== CART MODAL ===== */
.cart-overlay { position: fixed; inset: 0; background: var(--overlay-bg); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.cart-overlay.show { opacity: 1; pointer-events: auto; }
.cart-drawer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-2); border-top-left-radius: 24px; border-top-right-radius: 24px; max-height: 85vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); z-index: 201; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
.cart-drawer.show { transform: translateY(0); }
.cart-handle { width: 45px; height: 5px; background: var(--border); border-radius: 3px; margin: 12px auto 5px; }
.cart-head { padding: 10px 20px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
.cart-head h3 { font-size: 18px; font-weight: 800; }
.cart-head .close-x { background: var(--bg-3); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.cart-list { padding: 10px 20px; overflow-y: auto; flex: 1; }
.cart-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
.cart-empty .emoji { font-size: 50px; margin-bottom: 10px; opacity: 0.6; }
.cart-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-row:last-child { border-bottom: none; }
.cart-row-img { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #3a1a1f, #2a1414); display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden; }
.cart-row-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-row-body { flex: 1; min-width: 0; }
.cart-row-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
.cart-row-meta { font-size: 12px; color: var(--gold); font-weight: 700; }
.cart-row-qty { display: flex; align-items: center; gap: 6px; }
.cart-row-qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-3); color: var(--text); font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: inherit; }
.cart-row-qty button.plus { background: var(--primary); border-color: var(--primary); color: white; }
.cart-row-qty .q { min-width: 20px; text-align: center; font-weight: 700; font-size: 14px; }
.cart-foot { padding: 15px 20px 20px; border-top: 1px solid var(--border); background: var(--bg-2); }
.cart-summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; color: var(--text-dim); }
.cart-summary-row.total { color: var(--text); font-size: 18px; font-weight: 800; margin: 10px 0 15px; padding-top: 10px; border-top: 1px dashed var(--border); }
.cart-summary-row.total .t-price { color: var(--gold); }
.checkout-btn { width: 100%; background: linear-gradient(135deg, var(--green), #04a87a); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 6px 20px rgba(6,214,160,0.35); transition: all 0.2s; font-family: inherit; }
.checkout-btn:active { transform: scale(0.97); }

/* ===== WHATSAPP FLOAT ===== */
.wa-float { position: fixed; bottom: 95px; left: 15px; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #25d366, #128c7e); color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 6px 20px rgba(37,211,102,0.5); z-index: 99; text-decoration: none; transition: all 0.3s; }
.wa-float:active { transform: scale(0.9); }

/* ===== TOAST ===== */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--green); color: white; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; z-index: 300; box-shadow: 0 8px 24px rgba(6,214,160,0.4); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }

.no-results { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-dim); }
.no-results .emoji { font-size: 50px; margin-bottom: 10px; }
.item-qty-badge { position: absolute; top: 8px; left: 8px; background: var(--green); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; box-shadow: 0 3px 10px rgba(6,214,160,0.5); z-index: 2; }

.powered-by { text-align: center; padding: 30px 20px; color: var(--text-dim); font-size: 12px; }
.powered-by a { color: var(--gold); text-decoration: none; font-weight: 700; }
</style>
</head>

<!-- HERO -->
<div class="hero">

<!-- TOAST -->

<script>

/* ================================================================
   🚀  الكود - مش محتاج تعدل تحت هنا
   ================================================================ */

// === تطبيق CONFIG ===
document.documentElement.style.setProperty('--primary', CONFIG.primaryColor);
document.documentElement.style.setProperty('--primary-dark', CONFIG.primaryDarkColor);
document.documentElement.style.setProperty('--gold', CONFIG.accentColor);

document.title = CONFIG.restaurantName;
document.getElementById('cfgName').innerText = CONFIG.restaurantName;
document.getElementById('cfgDesc').innerText = CONFIG.description;
document.getElementById('cfgPhone').innerText = "📞 " + CONFIG.phone;
document.getElementById('cfgLocation').innerText = "📍 " + CONFIG.location;

const logoEl = document.getElementById('cfgLogo');
if (CONFIG.logo.startsWith('http')) {
  logoEl.innerHTML = `<img src="${CONFIG.logo}" alt="${CONFIG.restaurantName}">`;
} else {
  logoEl.innerText = CONFIG.logo;
}

document.getElementById('poweredLink').innerText = CONFIG.poweredBy;
document.getElementById('poweredLink').href = CONFIG.poweredByLink;

document.getElementById('waFloat').href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('مرحباً، عايز أستفسر عن الطلب')}`;

// === الثيم ===
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').innerText = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('menu_theme', next); } catch(e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('menu_theme'); } catch(e) {}
  applyTheme(saved || CONFIG.defaultTheme);
})();

// === الحالة ===
let cart = [];
let currentCategory = menuData[0].category;
let selectedOptions = {};
let searchQuery = "";

// === الأقسام ===
const categoriesEl = document.getElementById('categories');
function renderCategories() {
  categoriesEl.innerHTML = '';
  menuData.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-pill' + (cat.category === currentCategory && !searchQuery ? ' active' : '');
    b.innerHTML = `${cat.icon || ''} ${cat.category}`;
    b.onclick = () => {
      currentCategory = cat.category;
      searchQuery = "";
      document.getElementById('searchInput').value = "";
      renderCategories();
      renderMenu();
      window.scrollTo({ top: 250, behavior: 'smooth' });
    };
    categoriesEl.appendChild(b);
  });
}

// === المنيو ===
function renderMenu() {
  const menuEl = document.getElementById('menu');
  menuEl.innerHTML = '';

  if (searchQuery.trim()) {
    const q = searchQuery.trim();
    let results = [];
    menuData.forEach(cat => {
      cat.items.forEach((item, idx) => {
        if (item.name.includes(q)) results.push({ ...item, category: cat.category, itemIndex: idx, catIcon: cat.icon });
      });
    });
    if (results.length === 0) {
      menuEl.innerHTML = `<div class="no-results"><div class="emoji">🔍</div><div>مفيش نتائج للبحث عن "${q}"</div></div>`;
      return;
    }
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerText = `نتائج البحث (${results.length})`;
    menuEl.appendChild(title);
    results.forEach(r => menuEl.appendChild(createCard(r, r.itemIndex, r.category)));
  } else {
    const cat = menuData.find(c => c.category === currentCategory);
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerText = `${cat.icon || ''} ${cat.category}`;
    menuEl.appendChild(title);
    cat.items.forEach((item, idx) => menuEl.appendChild(createCard(item, idx, cat.category)));
  }
}

function createCard(item, itemIndex, categoryName) {
  const key = `${categoryName}__${item.name}`;
  const card = document.createElement('div');
  card.className = 'item-card';
  card.style.animationDelay = `${itemIndex * 0.04}s`;

  // خيارات
  const selectedIdx = selectedOptions[key];
  let optsHTML = '';
  item.options.forEach((opt, i) => {
    const sel = selectedIdx === i ? 'selected' : '';
    optsHTML += `<button class="opt-chip ${sel}" onclick="selectOpt(event,'${key}',${i})">${opt.label} · ${opt.price} ${CONFIG.currency}</button>`;
  });

  // صورة الصنف
  let imgHTML;
  if (item.image && item.image.startsWith('http')) {
    imgHTML = `<div class="item-img"><img src="${item.image}" alt="${item.name}"></div>`;
  } else {
    imgHTML = `<div class="item-img">${item.img || '🍽️'}</div>`;
  }

  // الشارات
  let badgesHTML = '';
  if (item.badges && item.badges.length) {
    item.badges.forEach(b => {
      if (b === 'best') badgesHTML += `<span class="badge best">⭐ الأكثر طلباً</span>`;
      if (b === 'new') badgesHTML += `<span class="badge new">جديد</span>`;
      if (b === 'hot') badgesHTML += `<span class="badge hot">🔥 حار</span>`;
    });
  }

  // الوصف
  const descHTML = item.desc ? `<div class="item-desc">${item.desc}</div>` : '';

  // زر الإضافة أو العدّاد
  const currentOptIdx = selectedIdx !== undefined ? selectedIdx : 0;
  const currentPrice = item.options[currentOptIdx].price;
  const cartItem = cart.find(c => c.id === key && c.size === item.options[currentOptIdx].label);
  const qty = cartItem ? cartItem.qty : 0;

  let actionHTML;
  if (qty > 0) {
    actionHTML = `<div class="qty-stepper"><button class="minus" onclick="changeQty(event,'${key}','${item.options[currentOptIdx].label}',-1)">−</button><span class="count">${qty}</span><button onclick="changeQty(event,'${key}','${item.options[currentOptIdx].label}',1)">+</button></div>`;
  } else {
    actionHTML = `<button class="add-btn" onclick="addToCart(event,'${key}','${item.name}','${item.img || '🍽️'}',${currentOptIdx})">+</button>`;
  }

  // شارة عدد في السلة
  const totalQty = cart.filter(c => c.id === key).reduce((s, c) => s + c.qty, 0);
  const itemBadgeHTML = totalQty > 0 ? `<div class="item-qty-badge">${totalQty}</div>` : '';

  card.innerHTML = `
    ${itemBadgeHTML}
    ${imgHTML}
    <div class="item-body">
      <div class="item-top-row">
        <div class="item-title">${item.name}</div>
        ${badgesHTML}
      </div>
      ${descHTML}
      <div class="options-row">${optsHTML}</div>
      <div class="price-action">
        <div class="price">${currentPrice} <small>${CONFIG.currency}</small></div>
        ${actionHTML}
      </div>
    </div>
  `;
  return card;
}

function selectOpt(e, key, idx) { e.stopPropagation(); selectedOptions[key] = idx; renderMenu(); }

function addToCart(e, key, name, img, optIdx) {
  e.stopPropagation();
  let foundItem = null;
  menuData.forEach(cat => cat.items.forEach(it => { if (`${cat.category}__${it.name}` === key) foundItem = it; }));
  if (!foundItem) return;
  const opt = foundItem.options[optIdx];
  const existing = cart.find(c => c.id === key && c.size === opt.label);
  if (existing) existing.qty += 1;
  else cart.push({ id: key, name, img, size: opt.label, price: opt.price, qty: 1 });
  selectedOptions[key] = undefined;
  showToast(`تمت إضافة ${name}`);
  updateCart();
  renderMenu();
}

function changeQty(e, key, size, delta) {
  e.stopPropagation();
  const idx = cart.findIndex(c => c.id === key && c.size === size);
  if (idx === -1) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCart();
  renderMenu();
  if (document.getElementById('cartDrawer').classList.contains('show')) renderCartList();
}

function handleSearch(val) {
  searchQuery = val;
  if (val.trim()) document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  else renderCategories();
  renderMenu();
}

function updateCart() {
  const totalQty = cart.reduce((s, c) => s + c.qty, 0);
  const totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
  const floatEl = document.getElementById('cartFloat');
  if (totalQty === 0) floatEl.classList.remove('show');
  else floatEl.classList.add('show');
  document.getElementById('cartBadge').innerText = totalQty;
  document.getElementById('cartTotalFloat').innerText = totalPrice;
}

function openCart() {
  renderCartList();
  document.getElementById('cartOverlay').classList.add('show');
  document.getElementById('cartDrawer').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeCart() {
  document.getElementById('cartOverlay').classList.remove('show');
  document.getElementById('cartDrawer').classList.remove('show');
  document.body.style.overflow = '';
}

function renderCartList() {
  const listEl = document.getElementById('cartList');
  const footEl = document.getElementById('cartFoot');
  if (cart.length === 0) {
    listEl.innerHTML = `<div class="cart-empty"><div class="emoji">🛒</div><div>سلتك فاضية</div><div style="font-size:12px;margin-top:5px;">أضف أصناف تبدأ طلبك</div></div>`;
    footEl.style.display = 'none';
    return;
  }
  footEl.style.display = 'block';
  let html = '';
  cart.forEach((item, idx) => {
    let imgHTML;
    if (item.img && item.img.startsWith('http')) {
      imgHTML = `<div class="cart-row-img"><img src="${item.img}" alt="${item.name}"></div>`;
    } else {
      imgHTML = `<div class="cart-row-img">${item.img}</div>`;
    }
    html += `<div class="cart-row">${imgHTML}<div class="cart-row-body"><div class="cart-row-name">${item.name}</div><div class="cart-row-meta">${item.size} · ${item.price} ${CONFIG.currency}</div></div><div class="cart-row-qty"><button onclick="decItem(${idx})">−</button><span class="q">${item.qty}</span><button class="plus" onclick="incItem(${idx})">+</button></div></div>`;
  });
  listEl.innerHTML = html;
  const totalQty = cart.reduce((s, c) => s + c.qty, 0);
  const totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
  document.getElementById('summaryCount').innerText = totalQty;
  document.getElementById('summaryTotal').innerText = totalPrice;
}

function incItem(idx) { cart[idx].qty += 1; updateCart(); renderMenu(); renderCartList(); }
function decItem(idx) { cart[idx].qty -= 1; if (cart[idx].qty <= 0) cart.splice(idx, 1); updateCart(); renderMenu(); renderCartList(); }

function sendToWhatsApp() {
  if (cart.length === 0) return;
  let msg = `🌯 *طلب جديد من ${CONFIG.restaurantName}*\n`;
  msg += "━━━━━━━━━━━━━━━\n";
  let total = 0;
  cart.forEach(item => {
    const line = item.price * item.qty;
    total += line;
    msg += `▪️ ${item.name} (${item.size}) × ${item.qty} = ${line} ${CONFIG.currency}\n`;
  });
  msg += "━━━━━━━━━━━━━━━\n";
  msg += `💰 *الإجمالي: ${total} ${CONFIG.currency}*\n\n`;
  msg += "📍 العنوان: \n";
  msg += "📞 رقم الموبايل: ";
  const url = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

renderCategories();
renderMenu();
updateCart();
</script>
